<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 2 - Responsive Navbar and Grid</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- my own css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-md navbar-light bg-light border-bottom">
    <div class="container">

      <a class="navbar-brand" href="#">MyShop</a>

      <!-- hamburger button (shows below 768px) -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainMenu" aria-controls="mainMenu"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainMenu">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>

        <a class="nav-link cart-link" href="#">Cart (0)</a>
      </div>

    </div>
  </nav>

  <!-- PRODUCT GRID -->
  <main class="container">
    <h2 class="page-title">Products</h2>

    <div class="product-grid">

      <div class="product-card">
        <img src="images/tshirt.jpeg" alt="T-Shirt">
        <h3>T-Shirt</h3>
        <p>$10.00</p>
        <button>Add to cart</button>
      </div>

      <div class="product-card">
        <img src="images/shoe2.webp" alt="Sneakers">
        <h3>Sneakers</h3>
        <p>$45.00</p>
        <button>Add to cart</button>
      </div>

      <div class="product-card">
        <img src="images/backpack.jpeg" alt="Backpack">
        <h3>Backpack</h3>
        <p>$30.00</p>
        <button>Add to cart</button>
      </div>

      <div class="product-card">
        <img src="images/watch.jpeg" alt="Wrist Watch">
        <h3>Wrist Watch</h3>
        <p>$40.00</p>
        <button>Add to cart</button>
      </div>

      <div class="product-card">
        <img src="images/mug.jpeg" alt="Coffee Mug">
        <h3>Coffee Mug</h3>
        <p>$8.00</p>
        <button>Add to cart</button>
      </div>

      <div class="product-card">
        <img src="images/headphone.jpeg" alt="Headphones">
        <h3>Headphones</h3>
        <p>$25.00</p>
        <button>Add to cart</button>
      </div>

      <div class="product-card">
        <img src="images/cap.jpeg" alt="Cap">
        <h3>Cap</h3>
        <p>$12.00</p>
        <button>Add to cart</button>
      </div>

      <div class="product-card">
        <img src="images/sunglasses.jpeg" alt="Sunglasses">
        <h3>Sunglasses</h3>
        <p>$15.00</p>
        <button>Add to cart</button>
      </div>

    </div>
  </main>

  <!-- Bootstrap JS (needed for the hamburger menu to work) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
